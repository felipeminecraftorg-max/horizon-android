plugins { id 'com.android.application' version '8.11.1' }

android {
    namespace 'dev.horizon.android'
    compileSdk 35
    defaultConfig {
        applicationId providers.gradleProperty('appId').getOrElse('dev.horizon.android')
        minSdk providers.gradleProperty('minSdk').getOrElse('28').toInteger()
        targetSdk 35
        versionCode providers.gradleProperty('devVersionCode').getOrElse('30').toInteger()
        versionName '0.7.8' + (providers.gradleProperty('devVersionCode').isPresent() ? '-dev.' + providers.gradleProperty('devBuild').get() : '')
        ndk { abiFilters providers.gradleProperty('abi').get() }
    }
    signingConfigs {
        development {
            storeFile file('../../.local/android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.development
            versionNameSuffix '-dev.' + providers.gradleProperty('devBuild').getOrElse('local')
            if (!providers.gradleProperty('appId').isPresent()) { applicationIdSuffix '.dev' }
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            // Retain the existing installation's signing identity for upgrades.
            // Only the public certificate enters the APK; the key stays in .local/.
            signingConfig signingConfigs.development
        }
    }
    sourceSets.main {
        java.srcDirs = ['java']
        manifest.srcFile 'AndroidManifest.xml'
        jniLibs.srcDirs = ['../../.local/android/gradle-jni']
        assets.srcDirs = ['../../.local/android/gradle-assets']
        res.srcDirs = ['res']
    }
    packaging {
        jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/*.so' }
        // R8 and Gson ship the same metadata files; the app needs none of them.
        resources { excludes += ['META-INF/versions/**', 'META-INF/*.kotlin_module', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.version', '**/module-info.class'] }
    }
    // The lane 3 runtime (java/dev/horizon/android/lane3/) uses Java 17's language.
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    // D8, to turn a Java mod's jar into DEX on the phone (mod converter lane 3). BSD-3-Clause.
    implementation 'com.android.tools:r8:8.11.+'
    // Gson, which Minecraft ships and many Java mods read their settings with. Apache-2.0.
    implementation 'com.google.code.gson:gson:2.11.0'
}
layout.buildDirectory = file('../../.local/android/gradle-build')
