name: Android converter tests
run-name: Converter tests · ${{ github.sha }}

# The mod converter's crates on their own: quick to build (no game, no
# Android toolchain), so their tests answer in a few minutes.
on:
  push:
    branches: [android]
    paths:
      - 'crates/horizon-port-pack/**'
      - 'crates/horizon-mods/**'
      - 'Cargo.lock'
      - '.github/workflows/android-converter-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-converter-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/converter-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/converter-target
          key: converter-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            converter-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
      - name: Test the converter crates
        run: |
          rustup show
          cargo test -p horizon-port-pack
          cargo test -p horizon-mods --lib --no-default-features
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/converter-target
          key: converter-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.sha }}
