# Re-test the already compiled 7a1e application without recompiling Minecraft.
name: Nexo Android smoke
on:
  pull_request:
    branches: [feature/horizon-nexo-standalone]
    paths: [.github/workflows/nexo-android-smoke.yml, packaging/android/androidTest/**]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nexo-android-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Require exactly the compiled application's runtime source
        run: |
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','7a1e5932e1195bdf2b5477e4bafd952d18959abb','HEAD'],text=True).splitlines())
          allowed={'.github/workflows/nexo-android-smoke.yml','packaging/android/androidTest/java/dev/horizon/android/NexoBootInstrumentation.java'}
          assert changed <= allowed,changed-allowed
          PY
          python3 tools/check_public_tree.py --ref HEAD
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: nexo-emulator-Linux-39311820929abaa79da01a57d19457ec2ae0eeff835c8a1d3f0c2f76b8bf7c80-7a1e5932e1195bdf2b5477e4bafd952d18959abb-checked
          fail-on-cache-miss: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: horizon-nexo-standalone-arm64
          path: .local/canonical
          run-id: 43892959812
          github-token: ${{ github.token }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14'
      - name: Stage the verified runtime and canonical assets
        run: |
          python3 - <<'PY'
          import hashlib,json,shutil,subprocess,zipfile
          from pathlib import Path
          meta=json.loads(Path('.local/canonical/BUILD.json').read_text())
          apk=next(Path('.local/canonical').glob('*.apk'))
          assert meta['commit']=='7a1e5932e1195bdf2b5477e4bafd952d18959abb'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='b8a121027ca856d44d89b53abc90c742edc079e8fe7ab9bf3e3856be7900f1c7'
          assets=Path('.local/android/gradle-assets');assets.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(apk) as z:
              for name in ['LICENSE.txt','THIRD_PARTY_NOTICES.md','engine-data.zip','lane3-api.jar']:
                  (assets/name).write_bytes(z.read('assets/'+name))
          original=Path('.local/ci-target/x86_64-linux-android/fast/libhorizon_android.so')
          assert original.is_file() and original.stat().st_size>1000000
          with original.open('rb') as file: header=file.read(20)
          assert header[:5]==b'\x7fELF\x02' and int.from_bytes(header[18:20],'little')==62
          dest=Path('.local/android/gradle-jni/x86_64/libhorizon_android.so');dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(original,dest)
          subprocess.run(['strip','--strip-unneeded',str(dest)],check=True)
          proof=Path('dist/nexo-android-boot');proof.mkdir(parents=True,exist_ok=True)
          (proof/'PROVENANCE.json').write_text(json.dumps({'runtime_commit':meta['commit'],'canonical_arm64_sha256':meta['sha256'],'native_x86_64_sha256':hashlib.sha256(dest.read_bytes()).hexdigest(),'runtime_source_changed':False},indent=2))
          PY
          keytool -genkeypair -keystore .local/android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 30 -dname 'CN=Nexo Android Smoke Test'
      - name: Build only the Android host and test driver
        run: |
          gradle --no-daemon -p packaging/android -Pabi=x86_64 -PappId=dev.horizon.nexo -PdevBuild=7a1e-native-smoke -PdevVersionCode=2025 assembleRelease assembleReleaseAndroidTest
          python3 tools/check_android_release.py .local/android/gradle-build/outputs/apk/release/HorizonAndroid-release.apk --public --app-id dev.horizon.nexo --aapt2 "$ANDROID_HOME/build-tools/35.0.0/aapt2" --report dist/nexo-android-boot/PACKAGE-AUDIT.json
      - name: Exercise the actual launcher on Android 14
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'emulator' 'system-images;android-34;google_apis;x86_64'
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/.local/nexo-avd"
          export ANDROID_USER_HOME="$GITHUB_WORKSPACE/.local/nexo-android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n nexo-qa -p "$ANDROID_AVD_HOME/nexo-qa.avd" -k 'system-images;android-34;google_apis;x86_64' --device pixel_2
          printf 'avd.ini.encoding=UTF-8\npath=%s\n' "$ANDROID_AVD_HOME/nexo-qa.avd" > "$ANDROID_AVD_HOME/nexo-qa.ini"
          "$ANDROID_HOME/emulator/emulator" -avd nexo-qa -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot -memory 2048 -cores 2 >dist/nexo-android-boot/emulator.txt 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          trap '"$adb" logcat -d > dist/nexo-android-boot/logcat.txt 2>&1 || true; "$adb" exec-out screencap -p > dist/nexo-android-boot/last-screen.png 2>/dev/null || true' EXIT
          timeout 90 "$adb" wait-for-device
          timeout 180 bash -c 'until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          "$adb" shell settings put global window_animation_scale 0
          "$adb" shell settings put global transition_animation_scale 0
          "$adb" shell settings put global animator_duration_scale 0
          "$adb" shell input keyevent 82
          "$adb" install -r .local/android/gradle-build/outputs/apk/release/HorizonAndroid-release.apk
          test_apk=$(find .local/android/gradle-build/outputs/apk/androidTest -name '*.apk' | head -n 1)
          "$adb" install -r -t "$test_apk"
          "$adb" logcat -c
          timeout 240 "$adb" shell am instrument -w dev.horizon.nexo.test/dev.horizon.android.NexoBootInstrumentation | tee dist/nexo-android-boot/instrumentation.txt
          "$adb" pull /sdcard/Android/data/dev.horizon.nexo/files/nexo-android-proof dist/nexo-android-boot/
          python3 - <<'PY'
          from pathlib import Path
          result=Path('dist/nexo-android-boot/instrumentation.txt').read_text()
          assert 'NEXO_ANDROID_RESULT PASS' in result,result[-12000:]
          assert 'NEXO_ANDROID_RESULT FAIL' not in result
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nexo-android-smoke-proof
          path: dist/nexo-android-boot/
          retention-days: 14
      - name: Destroy the disposable test signing key
        if: always()
        run: rm -f .local/android/debug.keystore
