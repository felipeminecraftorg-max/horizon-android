name: Glass Lab 2.1 Readability APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/glass-lab/source.zip'
      - '.github/workflows/build-glasslab.yml'
  push:
    paths:
      - 'experiments/glass-lab/source.zip'
      - '.github/workflows/build-glasslab.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract independent Glass Lab
        run: unzip -q experiments/glass-lab/source.zip -d "$RUNNER_TEMP"
      - name: Validate live GLSL glass shader
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq glslang-tools
          python3 - <<'PY'
          import os
          from pathlib import Path
          source=(Path(os.environ['RUNNER_TEMP'])/'glass_lab_project/web-demo/app.js').read_text()
          start=source.index('  const FRAG=`')+len('  const FRAG=`')
          stop=source.index('`;\n  function compileShader',start)
          Path('/tmp/glasslab_shader.frag').write_text(source[start:stop])
          PY
          glslangValidator -S frag /tmp/glasslab_shader.frag
      - name: Compile APK
        run: cd "$RUNNER_TEMP/glass_lab_project" && gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/glass_lab_project/app/build/outputs/apk/debug/app-debug.apk" dist/GlassLab-2.1-Readability.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlassLab-2.1-Android-APK
          path: dist/GlassLab-2.1-Readability.apk
          retention-days: 14
