name: Glass Lab 6.0 Particles and SFX APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/glass-lab/source.zip'
      - '.github/workflows/build-glasslab.yml'
  push:
    paths:
      - 'experiments/glass-lab/source.zip'
      - '.github/workflows/build-glasslab.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare SDK 35
        shell: bash
        run: |
          manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$manager" ]]; then
            manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$manager"
          "$manager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack isolated app
        run: unzip -q experiments/glass-lab/source.zip -d "$RUNNER_TEMP"
      - name: Run physical motion, export and sound tests
        run: |
          cd "$RUNNER_TEMP/glass_lab_project"
          node --check web-demo/app.js
          node --check web-demo/audio.js
          node --check web-demo/particles.js
          node test_app_pack.mjs
          node test_pack_runtime.cjs
          node test_physics.mjs
          node test_effects.cjs
      - name: Verify all user-provided sound assets are bundled and credited
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          base=Path(os.environ['RUNNER_TEMP'])/'glass_lab_project'
          sounds=json.loads((base/'web-demo/sfx/catalog.json').read_text())['sounds']
          assert len(sounds)==66, len(sounds)
          assert len({s['group'] for s in sounds})==8
          for item in sounds:
            assert (base/'web-demo'/item['file']).is_file(),item
            assert (base/'app/src/main/assets'/item['file']).is_file(),item
          assert (base/'CREDITS_SFX.md').exists()
          print('66 SFX in 8 packs; Android/web copies and credits verified')
          PY
      - name: Validate GLSL ES 3.00 with glslangValidator
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq glslang-tools
          python3 - <<'PY'
          from pathlib import Path
          import os
          s=(Path(os.environ['RUNNER_TEMP'])/'glass_lab_project/web-demo/app.js').read_text()
          begin=s.index('  const FRAG=`')+len('  const FRAG=`')
          end=s.index('`;
  function compileShader',begin)
          Path('/tmp/glasslab6.frag').write_text(s[begin:end])
          PY
          glslangValidator -S frag /tmp/glasslab6.frag
      - name: Compile standalone Android APK
        run: cd "$RUNNER_TEMP/glass_lab_project" && gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload experimental APK
        if: success()
        run: |
          mkdir -p dist
          cp "$RUNNER_TEMP/glass_lab_project/app/build/outputs/apk/debug/app-debug.apk" dist/GlassLab-6.0-Particulas-SFX.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GlassLab-6.0-Android-APK
          path: dist/GlassLab-6.0-Particulas-SFX.apk
          retention-days: 14
