name: Horizon XMB Mobile native GPU captures

on:
  pull_request:
    paths:
      - 'crates/horizon-client/examples/xmb_capture.rs'
      - 'crates/horizon-client/src/launcher_xmb.rs'
      - 'crates/horizon-client/src/ui_theme.rs'
      - 'crates/horizon-client-render/src/hud.wgsl'
      - 'crates/horizon-client-render/src/hud/xmb_wallpaper.wgsl'
      - 'crates/horizon-client-render/src/hud.rs'
      - '.github/workflows/xmb-mobile-captures.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xmb-mobile-captures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      HORIZON_TELEMETRY_URL: 'off'
      WGPU_BACKEND: vulkan
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install native dependencies and Mesa Lavapipe
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libasound2-dev libudev-dev libvulkan1 mesa-vulkan-drivers
          rustup show
          find /usr/share/vulkan/icd.d -type f -name '*.json' -print || true
          lvp="$(find /usr/share/vulkan/icd.d -type f -name '*lvp*.json' -print -quit 2>/dev/null)"
          if [[ -n "$lvp" ]]; then
            echo "VK_ICD_FILENAMES=$lvp" >> "$GITHUB_ENV"
          fi
      - name: Capture real XMB GPU scene at phone aspect ratios
        run: |
          cargo run -p horizon-client --no-default-features --example xmb_capture -- xmb-preview
      - name: Verify output PNG count and dimensions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack
          files = list(Path('xmb-preview').glob('XMB_*.png'))
          assert len(files) == 6, f'Expected six native captures, got {len(files)}'
          for path in files:
              b = path.read_bytes()
              assert b[:8] == b'\x89PNG\r\n\x1a\n'
              w, h = unpack('>II', b[16:24])
              assert w >= 900 and h >= 480, (path, w, h)
              assert len(b) > 8000, (path, len(b))
              print(path.name, f'{w}x{h}', len(b))
          PY
      - name: Label provenance of native previews
        run: |
          cat > xmb-preview/README.txt <<'EOF'
          HORIZON XMB MOBILE - NATIVE GPU PREVIEWS - STAGE 2/5
          Generated by the project's production Rust HUD renderer, with its
          actual procedural WGSL XMB atmosphere and original XMB icon family.
          These are render test fixtures, NOT screenshots from an Android phone.
          Live login, files, accounts and other Android pages are not represented.
          Source code: crates/horizon-client/examples/xmb_capture.rs
          No Sony/PlayStation proprietary art, font, logos or recordings.
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-xmb-mobile-stage2-gpu-previews
          path: xmb-preview/XMB_*.png
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-xmb-mobile-stage2-provenance
          path: xmb-preview/README.txt
          if-no-files-found: error
          retention-days: 14
