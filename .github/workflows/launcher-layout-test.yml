name: Native launcher layout tests
on:
  pull_request:
    paths:
      - 'crates/horizon-client/src/launcher_visual.rs'
      - 'crates/horizon-client/src/launcher_xmb.rs'
      - 'crates/horizon-client/src/android/launcher.rs'
      - 'crates/horizon-client/src/android/launcher_gesture.rs'
      - 'crates/horizon-client/src/launcher_preset_pack.rs'
      - 'crates/horizon-client/src/android/launcher_sfx.rs'
      - 'crates/horizon-client-render/src/hud/glass.wgsl'
      - 'crates/horizon-client-render/src/hud/glass.rs'
      - 'crates/horizon-client-render/src/audio.rs'
      - 'crates/horizon-client/src/android/launcher_pages.rs'
      - 'crates/horizon-client/src/ui_theme.rs'
      - '.github/workflows/launcher-layout-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update -q && sudo apt-get install -yq libasound2-dev libudev-dev
      - name: Validate Rust UI layout and navigation
        run: |
          rustup show
          cargo test -p horizon-client --lib launcher_visual::tests -- --test-threads=1
          cargo test -p horizon-client --lib launcher_xmb::tests -- --test-threads=1
          cargo test -p horizon-client --lib ui_theme::tests -- --test-threads=1
          cargo test -p horizon-client --lib launcher_preset_pack::tests
          cargo test -p horizon-client-render --lib physical_glass_shader_validates_with_naga
          cargo check -p horizon-client-render --lib

  android-xmb:
    # Compile the actual Android Rust launcher as well as the native UI library:
    # host-only tests cannot type-check code under cfg(target_os = "android").
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HORIZON_TELEMETRY_URL: 'off'
      CARGO_TARGET_DIR: .local/ci-target
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Install Android NDK and Rust target
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          rustup target add aarch64-linux-android
          # Google occasionally returns a truncated NDK ZIP on hosted runners.
          # Use the tested r28c first; fall back to an installed SDK NDK only
          # for a type-check (never for release signing or a shipped APK).
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "build-tools;35.0.0"
          if "$sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"; then
            ndk_version=28.2.13676358
          else
            echo "::warning::NDK r28c download failed; looking for an installed NDK to type-check Rust"
            ndk_version=""
            for folder in "$ANDROID_HOME"/ndk/*; do
              if [[ -f "$folder/source.properties" ]]; then
                ndk_version="${folder##*/}"
              fi
            done
            test -n "$ndk_version"
          fi
          echo "HORIZON_XMB_CHECK_NDK=$ndk_version" >> "$GITHUB_ENV"
      - name: Type-check real Android ARM64 launcher with XMB integration
        run: |
          python3 tools/android_build.py --abi arm64-v8a --check --public \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" \
            --ndk-version "$HORIZON_XMB_CHECK_NDK" --build-tools-version 35.0.0
