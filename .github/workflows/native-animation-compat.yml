name: Native animation compatibility tests
on:
  push:
    branches:
      - feature/build46-emf-etf-core
    paths:
      - 'crates/horizon-optifine/**'
      - 'crates/horizon-client-render/**'
      - '.github/workflows/native-animation-compat.yml'
  pull_request:
    paths:
      - 'crates/horizon-optifine/**'
      - 'crates/horizon-client-render/**'
      - '.github/workflows/native-animation-compat.yml'
  workflow_dispatch:

jobs:
  optifine-parsers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test OptiFine model, ETF and animation modules
        run: cargo test --locked -p horizon-optifine
      - name: Check renderer resource-loader integration
        run: cargo check --locked -p horizon-client --no-default-features-render
      - name: Check playable client CEM draw integration
        run: cargo check --locked -p horizon-client
