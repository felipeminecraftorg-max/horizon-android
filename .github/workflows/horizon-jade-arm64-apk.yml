# Isolated artifact-only build for the original Horizon Jade console remake.
# Never use the main app signing secret for a draft PR or development branch.
name: Horizon Jade ARM64 APK validation
run-name: Jade arm64 · ${{ github.sha }}

on:
  push:
    branches:
      - feature/horizon-jade-xbox360-part5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jade-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - name: Check out exactly this source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Set up Java for Gradle
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up verified Gradle toolchain
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14'
      - name: Install Android ARM64 toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq libasound2-dev libudev-dev
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup target add aarch64-linux-android
      - name: Audit public source and Android package rules
        run: |
          set -euo pipefail
          git diff --check
          python3 tools/check_public_tree.py --ref HEAD
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'
      - name: Type-check actual Android ARM64 Rust target before packaging
        run: |
          python3 tools/android_build.py --abi arm64-v8a --check --public \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0
      - name: Prepare engine tables from pinned official Minecraft downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Build and sign isolated public Jade dev APK
        run: |
          python3 tools/android_build.py --abi arm64-v8a --public --profile fast \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" \
            --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"
      - name: Verify signed APK and write provenance / checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          src=Path('.local/android/apk/arm64-v8a/horizon-android-public.apk')
          if not src.is_file() or src.stat().st_size < 1024 * 1024:
              raise SystemExit('Missing or incomplete signed ARM64 APK')
          dist=Path('dist')
          dist.mkdir(exist_ok=True)
          sha=os.environ['GITHUB_SHA']
          name=f'Horizon-Jade-stage5-{sha[:12]}-arm64-v8a.apk'
          dest=dist/name
          shutil.copyfile(src,dest)
          digest=hashlib.sha256(dest.read_bytes()).hexdigest()
          (dist/'SHA256SUMS.txt').write_text(f'{digest}  {name}\n')
          (dist/'BUILD.json').write_text(json.dumps({
              'branch':'feature/horizon-jade-xbox360-part5',
              'commit':sha,'abi':'arm64-v8a','package':'dev.horizon.android.dev',
              'channel':'experimental-jade','signed_with':'ephemeral CI debug key',
              'profile':'fast','sha256':digest,
              'workflow':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
          },indent=2)+'\n')
          shutil.copyfile('LICENSE',dist/'LICENSE.txt')
          shutil.copyfile('THIRD_PARTY_NOTICES.md',dist/'THIRD_PARTY_NOTICES.md')
          print(f'APK: {dest} ({dest.stat().st_size} bytes), SHA256 {digest}')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write(f'### Horizon Jade ARM64 APK\n\nCommit: \`{sha}\`\n\n'
                  f'SHA256: \`{digest}\`\n\n'
                  'Find the download ZIP under **Artifacts** below this run. '
                  'Installs as \`dev.horizon.android.dev\` with a temporary test key; '
                  'a conflicting existing dev build may require uninstall/backup first.\n')
          PY
      - name: Upload only signed APK, hashes and license metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-jade-stage5-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Destroy throwaway signing key
        if: always()
        run: rm -f .local/android/debug.keystore
