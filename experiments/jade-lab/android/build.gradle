plugins {
    id 'com.android.application' version '8.11.1'
}

android {
    namespace 'dev.horizon.jadelab'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.horizon.jadelab'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0-dark'
    }

    signingConfigs {
        disposable {
            // Ephemeral CI-only key. No existing launcher/Glass Lab signing keys.
            storeFile file('.local/jade-lab-debug.keystore')
            storePassword 'android'
            keyAlias 'jadelabdebug'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.disposable
        }
        debug {
            debuggable true
            signingConfig signingConfigs.disposable
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
