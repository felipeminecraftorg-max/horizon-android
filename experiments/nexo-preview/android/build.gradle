plugins { id 'com.android.application' version '8.11.1' }
android {
    namespace 'dev.horizon.jadelab'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.horizon.nexo.preview'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '1.0.0-update1'
    }
    sourceSets { main { java.srcDirs = ['../../jade-lab/android/src/main/java'] } }
    signingConfigs {
        disposable {
            storeFile file('.local/nexo-test.keystore')
            storePassword 'android'
            keyAlias 'nexotest'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { debuggable false; minifyEnabled false; signingConfig signingConfigs.disposable }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { }
